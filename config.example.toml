# Copy to config.toml and supply your own authorized session configuration.
listen = "127.0.0.1:8080"
response_mode = "public" # public (filtered), raw (trusted operators), or disabled
access_log = true # No URLs, query values, request bodies or credentials.
api_key_file = "secrets/http-api-key"
# credentials_file = "secrets/game-session.json"
timeout_seconds = 10
minimum_interval_ms = 1000
queue_capacity = 32
cache_ttl_seconds = 15
cache_capacity = 1024

# Managed login replaces credentials_file; these paths must be private.
# [login]
# context_file = "secrets/device-context.json"
# sdk_http_file = "secrets/sdk-http.json"
# state_dir = "secrets/state" # Existing writable directory, mode 0700.

# Optional lazy email/password source; requires all three [login] paths above.
# [accounts]
# directory = "/accounts" # Optional; this is the default.
# selected = "worker.json" # Required if more than one JSON file is present.
# allow_create = true # Only when pre-login reports no role in session.region.
# sdk_ready = true # Assert required official SDK consent/checks are complete.
# Files: {"user":"EMAIL","password":"PASSWORD"}, mode 0600; directory mode 0700.
# Health/status never load accounts. See docs/accounts.md before enabling.

[recovery]
enabled = false # Opt in: recovery may invalidate another device's session.
cooldown_seconds = 300

[session]
region = "configure-your-region"
origin = "https://game.example.invalid"
allowed_origins = ["https://game.example.invalid"]
platform = "android"
client_version = "1.0.1"
# Supply both together when required by the validated session.
# master_version = "validated-master-version"
# resource_version = "validated-resource-version"
